<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="Submitted">
        <fieldset>
         <legend>Personal Details</legend>
         <label for="username">Name:</label>
         <input type="text" id="username" name="username"> <br><br>
         <label for="useremail">Email:</label>
         <input type="email" id="useremail" name="useremail"> <br><br>
         <label for="userpassword">Password:</label>
         <input type="password" id="userpassword" name="userpassword"> <br><br>
         <label for="usergender">Gender:</label>
         
         <input type="radio" id="usermale" name="usergender">
         <label for="usermale">Male</label>
         
         <input type="radio" id="userfemale" name="usergender"> 
         <label for="userfemale">Female</label> <br><br>
         <label for="hobbies">Hobbies:</label>
         <input type="checkbox" name="hobbies" id="reading">
         <label for="reading">Reading</label>
         <input type="checkbox" name="hobbies" id="coding">
         <label for="coding">Coding</label> <br><br>
         <label for="dob">DOB:</label>
         <input type="date" id="dob" name="date of birth">

        
        </fieldset>
    </form>
    
</body>
</html>
