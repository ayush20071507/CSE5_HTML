<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rowspan and colspan (Timetable)</title>
</head>
<body>
    <table border="1" align="center" cellpadding="5" cellspacing="0">
        <caption><b>Weekly Timetable</b></caption>
        <thead>
            <tr align="center">
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
        </thead>

        <tbody>
            <tr align="center">
                <td>Mon</td>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr align="center">
                <td>Tue</td>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
        </tbody>

        <tfoot>
            <tr align="center">
                <td>Wed</td>
                <td colspan="3">Seminar</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
