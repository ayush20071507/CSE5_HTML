<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
    <div align="center">
   <form action="submit.php" method="post">
     <input type="text" name="username" placeholder="Full name" required> <br><br>
     <input type="email" name="useremail" placeholder="you@college.edu"  required> <br><br>
     <input type="tel"  name="userphone no." pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile" required> <br><br>
     <input type="password" name="password" placeholder="Min 6 characters" minlength="6" maxlength="20" required><br><br>
     <input type="number" name="age" placeholder="Age (17+)" min="17" max="30" required> <br><br>
     <button type="submit">Register</button>
   </form>
    </div>
</body>
</html>
